<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buenos Aires P1 – Order of Play</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=DM+Sans:wght@400;500;700&amp;family=Noto+Color+Emoji&amp;display=swap">
<style>
body{margin:0;background:#10002B}
a{color:#C77DFF}a:hover{color:#E0AAFF}
.day-pill{transition:background .15s ease, border-color .15s ease;text-decoration:none}
.day-pill:hover{border-color:#9D4EDD}
.rank{transition:background .15s ease;text-decoration:none}
.rank:hover{background:#E0AAFF}
.emo{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif}
.np{position:relative;display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font:inherit;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#E0AAFF;background:rgba(157,78,221,.22);border:1px solid rgba(199,125,255,.35);border-radius:999px;padding:4px 10px;cursor:default;transition:background .15s ease,border-color .15s ease}
.np:hover,.np:focus-visible{background:rgba(157,78,221,.38);border-color:#C77DFF;outline:none}
.np-tip{position:absolute;top:calc(100% + 10px);left:0;width:230px;box-sizing:border-box;background:#3C096C;border:1px solid #9D4EDD;border-radius:12px;padding:12px 14px;box-shadow:0 14px 34px rgba(0,0,0,.5);text-align:left;text-transform:none;letter-spacing:0;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .15s ease,transform .15s ease;z-index:20}
.np-tip::before{content:"";position:absolute;top:-6px;left:18px;width:10px;height:10px;background:#3C096C;border-left:1px solid #9D4EDD;border-top:1px solid #9D4EDD;transform:rotate(45deg)}
.np:hover .np-tip,.np:focus-visible .np-tip{opacity:1;transform:translateY(0)}
</style>
</helmet>
<div style="background: #10002B; color: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; min-height: 100vh">

  <section style="background: #240046; border-bottom: 1px solid #3C096C">
    <div style="max-width: 1200px; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px">
      <img src="/_blob/3399f4ad42546dd2085b748cabb56a6c" alt="Buenos Aires P1 poster" style="width: 136px; aspect-ratio: 4 / 5; object-fit: cover; object-position: top; border-radius: 12px; border: 1px solid #5A189A; flex-shrink: 0">
      <div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
        <a href="Main.dc.html" style="font-size: 14px; font-weight: 500; text-decoration: none">← All tournaments</a>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
          <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 48px; line-height: 1; text-transform: uppercase">Buenos Aires P1</h1>
          <span style="background: #9D4EDD; color: #FFFFFF; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 4px 10px; border-radius: 999px">P1</span>
        </div>
        <div style="font-size: 15px; color: rgba(224,170,255,0.8)">May 10–17, 2026 · Buenos Aires, Argentina</div>
      </div>
    </div>
  </section>

  <nav aria-label="Tournament days" style="border-bottom: 1px solid #3C096C; background: #10002B">
    <div style="max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: nowrap; gap: 10px; overflow-x: auto">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="8">
        <a class="day-pill" href="#" style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; min-width: 64px; padding: 8px 14px; border-radius: 12px; background: {{d.bg}}; border: 1px solid {{d.border}}; color: {{d.color}}">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase">{{d.weekday}}</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.1">{{d.date}}</span>
        </a>
      </sc-for>
    </div>
  </nav>

  <main style="max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px">
    <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 20px">
      <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; text-transform: uppercase">Court Central</h2>
      <span style="font-size: 14px; color: rgba(224,170,255,0.8)">Local time <span style="color: #FFFFFF; font-weight: 700">9:14 AM</span> · ART (UTC−3)</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px">
      <sc-for list="{{matches}}" as="m" hint-placeholder-count="3">
        <article style="background: #240046; border: 1px solid #3C096C; border-radius: 16px; display: flex; flex-direction: column">
          <div style="background: #3C096C; border-radius: 15px 15px 0 0; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
            <span style="font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase">{{m.time}}</span>
            <span style="font-size: 12px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: #E0AAFF">Quarterfinals</span>
          </div>

          <sc-for list="{{m.teams}}" as="team" hint-placeholder-count="2">
            <div style="padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid #3C096C">
              <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
                <sc-for list="{{team.players}}" as="p" hint-placeholder-count="2">
                  <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
                    <span class="emo" role="img" aria-label="{{p.country}}" style="font-size: 18px; line-height: 1">{{p.flag}}</span>
                    <span style="font-size: 15px; font-weight: {{team.weight}}; color: {{team.nameColor}}">{{p.name}}</span>
                    <sc-if value="{{p.hasSeed}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: rgba(224,170,255,0.75)">({{p.seed}})</span></sc-if>
                    <a class="rank" href="{{p.url}}" target="_blank" rel="noopener" style="font-size: 11px; font-weight: 700; letter-spacing: 0.5px; background: #C77DFF; color: #10002B; padding: 2px 8px; border-radius: 999px">FIP #{{p.rank}}</a>
                  </div>
                </sc-for>
                <sc-if value="{{team.newPair}}" hint-placeholder-val="{{false}}">
                  <button type="button" class="np" aria-label="New pair: previously with [partner name] at [previous tournament]">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"></path><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"></path></svg>
                    New pair
                    <span class="np-tip">
                      <span style="display: block; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #C77DFF">New partnership</span>
                      <span style="display: block; margin-top: 6px; font-size: 14px; font-weight: 500; color: #FFFFFF">Previously with [partner name]</span>
                      <span style="display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: rgba(224,170,255,0.8)">at [previous tournament]</span>
                    </span>
                  </button>
                </sc-if>
              </div>
              <div style="display: flex; align-items: center; gap: 12px; flex-shrink: 0">
                <div class="emo" style="display: flex; gap: 4px; font-size: 20px; line-height: 1">
                  <sc-if value="{{team.champion}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="Tournament champions" title="Tournament champions">👑</span></sc-if>
                  <sc-if value="{{team.winner}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="Match winners" title="Match winners">🏅</span></sc-if>
                </div>
                <div style="display: flex; gap: 6px">
                <sc-for list="{{team.sets}}" as="s" hint-placeholder-count="2">
                  <span style="width: 30px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; background: {{s.bg}}; color: {{s.color}}">{{s.v}}</span>
                </sc-for>
                </div>
              </div>
            </div>
          </sc-for>

          <div style="margin-top: auto; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: rgba(224,170,255,0.8)">
            <span style="text-transform: uppercase; letter-spacing: 1px">{{m.footer}}</span>
            <a href="#" style="font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; text-decoration: none">Match stats</a>
          </div>
        </article>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var base = 'https://www.padelfip.com/player/';
    var flags = { ESP: ['🇪🇸', 'Spain'], ARG: ['🇦🇷', 'Argentina'], POR: ['🇵🇹', 'Portugal'], ITA: ['🇮🇹', 'Italy'], BRA: ['🇧🇷', 'Brazil'] };
    function pl(name, slug, nat, rank, seed) {
      var f = flags[nat] || ['🏳️', nat];
      return { name: name, url: base + slug + '/', flag: f[0], country: f[1], rank: rank, seed: seed || '', hasSeed: !!seed };
    }
    function match(time, footer, a, b) {
      var aWins = 0, bWins = 0;
      a.sets.forEach(function (v, i) { if (v > b.sets[i]) { aWins++; } else { bWins++; } });
      function team(t, opp, winner) {
        return {
          players: t.players,
          newPair: !!t.newPair,
          champion: !!t.champion,
          winner: winner,
          weight: winner ? '700' : '400',
          nameColor: winner ? '#FFFFFF' : 'rgba(224,170,255,0.75)',
          sets: t.sets.map(function (v, i) {
            var won = v > opp.sets[i];
            return { v: v, bg: won ? '#9D4EDD' : '#3C096C', color: won ? '#FFFFFF' : 'rgba(224,170,255,0.8)' };
          })
        };
      }
      return { time: time, footer: footer, teams: [team(a, b, aWins > bWins), team(b, a, bWins > aWins)] };
    }
    var days = [['Sun','10'],['Mon','11'],['Tue','12'],['Wed','13'],['Thu','14'],['Fri','15'],['Sat','16'],['Sun','17']];
    return {
      days: days.map(function (d) {
        var active = d[1] === '15';
        return {
          weekday: d[0], date: 'May ' + d[1],
          bg: active ? '#9D4EDD' : '#240046',
          border: active ? '#9D4EDD' : '#3C096C',
          color: active ? '#FFFFFF' : '#E0AAFF'
        };
      }),
      matches: [
        match('Starting at 9:00 AM', '01:08 · Completed',
          { players: [pl('A. Sanchez Fallada', 'ariana-sanchez-fallada', 'ESP', 5), pl('A. Ustero Prieto', 'andrea-ustero-prieto', 'ESP', 7, '3')], sets: [6, 6] },
          { players: [pl('M. Ortega Gallego', 'marta-ortega-gallego', 'ESP', 10), pl('M. Calvo', 'martina-calvo', 'ESP', 12, '6')], sets: [0, 2] }),
        match('Followed by', '02:04 · Completed',
          { players: [pl('A. Salazar Bengoechea', 'alejandra-salazar-bengoechea', 'ESP', 13), pl('A. Alonso De Villa', 'alejandra-alonso-de-villa', 'ESP', 14, '7')], sets: [5, 6, 2], newPair: true },
          { players: [pl('P. Josemaria Martin', 'paula-josemaria-martin', 'ESP', 4), pl('B. Gonzalez Fernandez', 'beatriz-gonzalez-fernandez', 'ESP', 3, '2')], sets: [7, 2, 6] }),
        match('Followed by', 'Completed',
          { players: [pl('T. Icardo Alcorisa', 'tamara-icardo-alcorisa', 'ESP', 9), pl('C. Jensen', 'claudia-jensen', 'ARG', 11, '5')], sets: [6, 3, 1] },
          { players: [pl('C. Fernandez Sanchez', 'claudia-fernandez-sanchez', 'ESP', 6), pl('S. Araujo', 'sofia-araujo', 'POR', 8, '4')], sets: [3, 6, 6] })
      ]
    };
  }
}
</script>
</body>
</html>
